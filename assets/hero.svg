<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Abhinav - animated hero banner with a cute cat and code window" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff00c8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff00c8"/>
    </linearGradient>
    <clipPath id="c1"><rect x="458" y="94" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.05;0.15;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="458" y="116" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.17;0.27;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="458" y="138" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.29;0.39;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="458" y="160" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.41;0.51;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="458" y="182" height="20" width="0"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.53;0.6;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', 'DejaVu Sans Mono', monospace; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- card -->
  <rect x="1.5" y="1.5" width="897" height="297" rx="22" fill="#0d1117" stroke="url(#border)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="28" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="38" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="48" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="35" cy="255" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="268" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="266" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.9s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="240" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code glyphs -->
  <g class="mono" font-size="16" font-weight="700" text-anchor="middle">
    <text x="392" y="95" fill="#00f5ff" opacity="0.55">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="405" y="245" fill="#ff00c8" opacity="0.55">{ }
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="248" fill="#7b2ff7" opacity="0.8">;
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="395" y="170" fill="#7b2ff7" opacity="0.6" font-size="13">01
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4.5s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="690" y="70" fill="#00f5ff" opacity="0.5" font-size="14">#
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- name + tagline -->
  <text class="mono" x="50" y="132" font-size="68" font-weight="700" letter-spacing="2" fill="url(#g)">abhinav</text>
  <text class="mono" x="52" y="172" font-size="18" fill="#8b949e"><tspan fill="#00f5ff">&gt;</tspan> software engineer<tspan class="blink" fill="#00f5ff"> ▌</tspan></text>
  <text class="mono" x="52" y="202" font-size="14" fill="#6e7681">// C++ • DSA • Web • AI/ML</text>

  <!-- code window -->
  <rect x="440" y="50" width="240" height="170" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="440" y="50" width="240" height="26" rx="12" fill="#1c2230"/>
  <rect x="440" y="64" width="240" height="12" fill="#1c2230"/>
  <circle cx="458" cy="63" r="4" fill="#ff5f56"/>
  <circle cx="473" cy="63" r="4" fill="#ffbd2e"/>
  <circle cx="488" cy="63" r="4" fill="#27c93f"/>
  <text class="mono" x="600" y="67" font-size="10" fill="#6e7681" text-anchor="middle">dev.js</text>

  <g class="mono" font-size="12">
    <text x="458" y="108" clip-path="url(#c1)"><tspan fill="#c792ea">const</tspan> <tspan fill="#82aaff">dev</tspan> <tspan fill="#89ddff">=</tspan> <tspan fill="#c9d1d9">{</tspan></text>
    <text x="474" y="130" clip-path="url(#c2)"><tspan fill="#82aaff">name</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#00f5ff">"Abhinav"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="474" y="152" clip-path="url(#c3)"><tspan fill="#82aaff">loves</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#c9d1d9">[</tspan><tspan fill="#00f5ff">"C++"</tspan><tspan fill="#8b949e">,</tspan> <tspan fill="#00f5ff">"AI/ML"</tspan><tspan fill="#c9d1d9">]</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="474" y="174" clip-path="url(#c4)"><tspan fill="#82aaff">coffee</tspan><tspan fill="#8b949e">:</tspan> <tspan fill="#ff00c8">true</tspan></text>
    <text x="458" y="196" clip-path="url(#c5)"><tspan fill="#c9d1d9">};</tspan></text>
  </g>
  <rect class="blink" x="476" y="184" width="7" height="15" fill="#00f5ff"/>

  <!-- cat shadow -->
  <ellipse cx="780" cy="274" rx="56" ry="6" fill="#000000" opacity="0.4"/>

  <!-- floating heart -->
  <text x="800" y="112" font-size="14" fill="#ff00c8" text-anchor="middle" opacity="0">♥
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-26" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- cute cat -->
  <g transform="translate(780,160)">
    <animateTransform attributeName="transform" type="translate" values="780,160;780,157;780,160" dur="3s" repeatCount="indefinite"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 40 90;14 40 90;-10 40 90" dur="2.2s" repeatCount="indefinite"/>
      <path d="M40 92 C88 98 94 42 64 38" fill="none" stroke="#f3eefc" stroke-width="11" stroke-linecap="round"/>
      <path d="M62 38 C60 38 58 39 56 40" fill="none" stroke="#b9a7e8" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <ellipse cx="0" cy="72" rx="46" ry="40" fill="#f3eefc"/>
    <ellipse cx="-17" cy="108" rx="12" ry="7" fill="#e2dcf3"/>
    <ellipse cx="17" cy="108" rx="12" ry="7" fill="#e2dcf3"/>

    <!-- ears -->
    <polygon points="-36,4 -36,-44 -4,-14" fill="#f3eefc"/>
    <polygon points="-30,-4 -30,-32 -12,-14" fill="#ffb3d9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 30 -8;0 30 -8;-9 30 -8;0 30 -8;0 30 -8" keyTimes="0;0.8;0.85;0.9;1" dur="5s" repeatCount="indefinite"/>
      <polygon points="36,4 36,-44 4,-14" fill="#f3eefc"/>
      <polygon points="30,-4 30,-32 12,-14" fill="#ffb3d9"/>
    </g>

    <!-- head -->
    <ellipse cx="0" cy="20" rx="42" ry="36" fill="#f3eefc"/>
    <path d="M-6 -12 v8 M0 -15 v10 M6 -12 v8" stroke="#b9a7e8" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <ellipse cx="-15" cy="20" rx="4.5" ry="6" fill="#1a1030">
      <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="15" cy="20" rx="4.5" ry="6" fill="#1a1030">
      <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="-13.5" cy="17.5" r="1.6" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16.5" cy="17.5" r="1.6" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- face details -->
    <ellipse cx="-27" cy="32" rx="6" ry="3.5" fill="#ffb3d9" opacity="0.55"/>
    <ellipse cx="27" cy="32" rx="6" ry="3.5" fill="#ffb3d9" opacity="0.55"/>
    <polygon points="-3.5,27 3.5,27 0,31" fill="#ff8fc0"/>
    <path d="M0 31 Q-4 36 -8 33 M0 31 Q4 36 8 33" stroke="#5b4b7a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <g stroke="#cfc6e8" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
      <line x1="-30" y1="28" x2="-54" y2="24"/>
      <line x1="-30" y1="33" x2="-54" y2="35"/>
      <line x1="30" y1="28" x2="54" y2="24"/>
      <line x1="30" y1="33" x2="54" y2="35"/>
    </g>
  </g>
</svg>
