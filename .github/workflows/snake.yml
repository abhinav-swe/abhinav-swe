name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2300e5ff&color_dots=%23ffffff0f,%230078b84d,%2300a8e880,%2300e5ffb3,%238b5cf6cc&color_dot_border=%23ffffffb3

      - name: Add glass and glow effect
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 - <<'PY'
          import re
          p = "dist/github-snake.svg"
          s = open(p, encoding="utf-8").read()

          defs = (
              '<defs><filter id="glow" x="-10%" y="-10%" width="120%" height="120%">'
              '<feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>'
              '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'
              '</filter></defs>'
              '<style>.c{rx:3px;ry:3px;stroke-width:1px}</style>'
              '<g filter="url(#glow)">'
          )

          s = re.sub(r'(<svg[^>]*>)', r'\1' + defs, s, count=1)
          s = s.replace('</svg>', '</g></svg>')
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
