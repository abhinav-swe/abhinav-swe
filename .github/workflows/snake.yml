
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%2300e5ff&color_dots=%23061120,%230b2940,%230078b8,%2300cfff,%238b5cf6

      - name: Add white borders to SVG squares
        run: |
          sudo chmod u+w dist/github-snake.svg

          python - <<'PY'
          from pathlib import Path
          import re

          file = Path("dist/github-snake.svg")
          svg = file.read_text()

          svg = re.sub(
              r'<rect\b(?![^>]*\bstroke=)',
              '<rect stroke="#ffffff" stroke-opacity="0.75" '
              'stroke-width="0.7"',
              svg
          )

          file.write_text(svg)
          print("SVG border processing completed.")
          PY


      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
